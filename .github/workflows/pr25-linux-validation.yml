name: Verify PR 25 on Linux
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  race:
    if: github.event.pull_request.number == 25
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Test recovery and replay
        run: go test -race -count=10 -run 'TestBridgeListenerMetadataFinality|TestStartupSyncObservesFinalityAfterSyncStatus|TestInterpretUnwrapSelectsLogByIdentity/missing_receipt' ./network
      - name: Test affected packages
        run: go test -race -count=1 ./app ./common ./common/config ./db/... ./network ./node ./rpc
